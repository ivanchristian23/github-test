name: Simple Action
on: [push]

jobs:
    simple-action:
        runs-on: ubuntu-latest
        steps:
            - name: Simple JS Action
              id: greet
              uses: actions/hello-world-javascript-action@79ac0da13ee392da3fdd151813d5ce4658cb7e27  #docker image can also be inputted can specify branch version can also be specified
              with:
                who-to-greet: Ivan 
            - name: Log Greeting Time
              run: echo "${{steps.greet.outputs.time}}"
